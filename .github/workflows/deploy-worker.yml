# worker/ 폴더가 바뀌면 Cloudflare Worker 를 배포한다.
# 인증키는 저장소 Settings → Secrets 에만 있고, 이 작업이 Worker 비밀 값(KMA_API_KEY)으로 넘겨준다.
name: Worker 배포

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Worker 배포 (wrangler)
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.151.1'
          secrets: |
            KMA_API_KEY
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}

      - name: 배포 주소 남기기
        run: echo "::notice title=Worker URL::${{ steps.deploy.outputs.deployment-url }}"
