# worker/ 폴더가 바뀌면 Cloudflare Worker 를 배포한다.
# 인증키는 저장소 Settings → Secrets 에만 있고, 이 작업이 Worker 비밀 값(KMA_API_KEY)으로 넘겨준다.
name: Worker 배포

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # 답장 스티커 저장소(KV). 이름으로 찾아 없으면 만들고, 번호를 설정 파일에 붙인다 (번호는 비밀이 아님)
      - name: 답장 저장소(KV) 준비
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          ID=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$API?per_page=100" | jq -r '.result[] | select(.title=="kreceipt-reactions") | .id')
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              -d '{"title":"kreceipt-reactions"}' "$API" | jq -r '.result.id')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then echo "::error::KV 저장소를 만들지 못했어요 (토큰 권한 확인)"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "REACTIONS"\nid = "%s"\n' "$ID" >> worker/wrangler.toml
          echo "::notice title=KV::kreceipt-reactions 연결됨"

      - name: Worker 배포 (wrangler)
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.151.1'
          secrets: |
            KMA_API_KEY
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}

      - name: 배포 주소 남기기
        run: echo "::notice title=Worker URL::${{ steps.deploy.outputs.deployment-url }}"
