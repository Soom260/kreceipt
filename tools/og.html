<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 링크 미리보기(og:image) 1200×630 이미지 원본 */
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#eef3f8;font-family:'Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;gap:80px;color:#1d1d1f}
.r{width:300px;background:#fff;padding:28px 26px;font-family:Consolas,'Malgun Gothic',monospace;font-size:17px;line-height:1.9;transform:rotate(-3deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.3)}
.b{text-align:center;letter-spacing:.3em;font-weight:700}.m{text-align:center;color:#888;font-size:14px}
hr{border:0;border-top:2px dashed #c7c7cc;margin:8px 0}.row{display:flex;justify-content:space-between}
.bc{height:46px;margin-top:14px;background:repeating-linear-gradient(90deg,#1d1d1f 0 3px,#fff 3px 6px,#3b82f6 6px 8px,#fff 8px 11px,#1d1d1f 11px 15px,#fff 15px 18px)}
h1{font-size:64px;letter-spacing:.12em}p{font-size:30px;color:#555;margin-top:12px}
</style></head><body>
<div class="r"><div class="b">KRECEIPT</div><div class="m">TODAY</div><hr>
<div class="row"><span>커피 ×2</span><span>9,000</span></div><div class="row"><span>김밥</span><span>3,500</span></div><hr>
<div class="row"><b>TOTAL</b><b>12,500</b></div><div class="m">— 오늘도 잘 썼다</div><div class="bc"></div></div>
<div><h1>KRECEIPT</h1><p>영수증으로 쓰는 하루 기록</p><p>친구가 오늘의 영수증을 보냈어요</p></div>
</body></html>
